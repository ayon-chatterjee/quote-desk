<title>Quote Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Chivo:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#e9edea; --surface:#fbfcfb; --surface-2:#f2f5f3; --sunk:#e1e7e3;
  --ink:#101817; --ink-2:#41504b; --ink-3:#6b7c76; --line:#cdd7d1; --line-2:#dde4e0;
  --accent:#0f5f5a; --accent-ink:#ffffff; --accent-soft:#dcebe8;
  --rule:#465861; --rule-soft:#e2e8ea; --rule-ink:#2b3940;
  --ai:#5348c7; --ai-soft:#e6e4f8; --ai-ink:#3d34a0;
  --human:#9b3d6e; --human-soft:#f7e2ec; --human-ink:#7d2c56;
  --pass:#2e7d4f; --pass-soft:#dff0e5;
  --warn:#a4700f; --warn-soft:#fbeed2;
  --crit:#a33030; --crit-soft:#fadedd;
  --mark:#fbe7a2; --mark-line:#c99a2e; --mark-crit:#f8cfc9; --mark-crit-line:#b8503f;
  --radius:7px; --radius-lg:11px;
  --shadow:0 1px 2px rgba(16,24,23,.06),0 4px 14px rgba(16,24,23,.05);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Chivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --disp:"Saira Condensed","Chivo",-apple-system,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1312; --surface:#151d1b; --surface-2:#1b2422; --sunk:#0a100f;
  --ink:#e2eae7; --ink-2:#a8b8b2; --ink-3:#7c8c86; --line:#2c3936; --line-2:#243130;
  --accent:#4fb3aa; --accent-ink:#06201e; --accent-soft:#153230;
  --rule:#93a6ae; --rule-soft:#212c30; --rule-ink:#b6c6cc;
  --ai:#9c93f0; --ai-soft:#231f47; --ai-ink:#b9b2f7;
  --human:#e086b3; --human-soft:#37203098; --human-ink:#eda6c8;
  --pass:#5fbc85; --pass-soft:#132a1e;
  --warn:#d8a63f; --warn-soft:#2e2512;
  --crit:#e2726c; --crit-soft:#331917;
  --mark:#6a5312; --mark-line:#d9ae3d; --mark-crit:#4d211c; --mark-crit-line:#e08a7c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#0d1312; --surface:#151d1b; --surface-2:#1b2422; --sunk:#0a100f;
  --ink:#e2eae7; --ink-2:#a8b8b2; --ink-3:#7c8c86; --line:#2c3936; --line-2:#243130;
  --accent:#4fb3aa; --accent-ink:#06201e; --accent-soft:#153230;
  --rule:#93a6ae; --rule-soft:#212c30; --rule-ink:#b6c6cc;
  --ai:#9c93f0; --ai-soft:#231f47; --ai-ink:#b9b2f7;
  --human:#e086b3; --human-soft:#372030; --human-ink:#eda6c8;
  --pass:#5fbc85; --pass-soft:#132a1e;
  --warn:#d8a63f; --warn-soft:#2e2512;
  --crit:#e2726c; --crit-soft:#331917;
  --mark:#6a5312; --mark-line:#d9ae3d; --mark-crit:#4d211c; --mark-crit-line:#e08a7c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;letter-spacing:.005em;margin:0;text-wrap:balance;line-height:1.14}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0 0 .7em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* shell ---------------------------------------------------------------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:1px;padding:0 6px}
.brand b{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:500}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:var(--radius);color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .n{font-family:var(--mono);font-size:11px;background:var(--sunk);border-radius:20px;padding:0 6px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav a[aria-current="page"] .n{background:var(--accent);color:var(--accent-ink)}
.nav .n.hot{background:var(--human);color:#fff}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:11.5px;color:var(--ink-3)}
.legend{display:flex;flex-direction:column;gap:4px;padding:9px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--line-2)}
.legend b{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
main{padding:26px 30px 70px;max-width:1180px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:6px;flex-wrap:wrap}
.lede{color:var(--ink-2);max-width:64ch;margin-bottom:20px}

/* lane badges ---------------------------------------------------------- */
.lane{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:1px 5px;border-radius:3px;white-space:nowrap;vertical-align:middle}
.lane-rule{background:var(--rule-soft);color:var(--rule-ink);border:1px solid transparent}
.lane-ai{background:var(--ai-soft);color:var(--ai-ink)}
.lane-human{background:var(--human-soft);color:var(--human-ink);border:1px dashed var(--human)}
.dot{width:7px;height:7px;border-radius:2px;flex:none}
.dot-rule{background:var(--rule)}.dot-ai{background:var(--ai);border-radius:50%}
.dot-human{background:transparent;border:1.5px dashed var(--human)}

/* generic bits ---------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:14px;align-items:baseline;justify-content:space-between}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;padding:6px 13px;border-radius:var(--radius);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:600}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1.5px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.chip-pass{background:var(--pass-soft);color:var(--pass)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-crit{background:var(--crit-soft);color:var(--crit)}
.chip-mute{background:var(--sunk);color:var(--ink-3)}
.chip-info{background:var(--accent-soft);color:var(--accent)}
.tag{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);background:var(--sunk);padding:0 5px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:700}
.muted{color:var(--ink-3)}
.hr{height:1px;background:var(--line-2);border:0;margin:14px 0}
.scroll-x{overflow-x:auto}
.empty{padding:34px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--radius-lg)}

/* sample lab ------------------------------------------------------------ */
.lab{display:grid;grid-template-columns:1fr 262px;gap:22px;align-items:start}
.rfq-group{margin-bottom:22px}
.rfq-group>header{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.rfq-group h3{font-size:15px}
.samples{display:flex;flex-direction:column;gap:7px}
.sample{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--radius);padding:10px 13px;cursor:pointer;text-align:left;width:100%}
.sample:hover{border-color:var(--accent);border-left-color:var(--accent)}
.sample.done{border-left-color:var(--pass)}
.sample.attn{border-left-color:var(--human)}
.sample.out{border-left-color:var(--crit)}
.sample h4{font-family:var(--sans);font-size:13.5px;font-weight:700;margin:0 0 1px}
.sample p{font-size:12.5px;color:var(--ink-2);margin:0 0 5px}
.filters{position:sticky;top:22px;display:flex;flex-direction:column;gap:5px}
.filters button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;cursor:pointer;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.filters small{display:block;color:var(--ink-3);font-size:11px;font-weight:400}

/* email view ------------------------------------------------------------ */
.envelope{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.envelope header{padding:14px 18px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.envelope .meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;margin-top:7px}
.envelope .meta dt{color:var(--ink-3);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.envelope .meta dd{margin:0}
.bodytext{padding:16px 18px;white-space:pre-wrap;font-size:13.5px;line-height:1.62;word-break:break-word}
.bodytext.tr{font-family:var(--mono);font-size:12.5px;background:var(--sunk);line-height:1.62}
.quoted{color:var(--ink-3);border-left:2px solid var(--line);padding-left:11px;margin-top:14px;font-size:12.5px}
mark{background:var(--mark);color:inherit;border-bottom:2px solid var(--mark-line);border-radius:2px;padding:0 1px;cursor:help}
mark.crit{background:var(--mark-crit);border-bottom-color:var(--mark-crit-line)}
.tabs{display:flex;gap:2px;padding:0 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2);overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 11px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.svtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.svtabs a{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.svtabs a:hover{background:var(--surface-2)}
.svtabs a.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.split{display:grid;grid-template-columns:1fr 336px;gap:18px;align-items:start}
.stepper{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:6px 0;font-size:12.5px}
.step .pip{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);margin-top:4px;justify-self:center}
.step.on .pip{border-color:var(--accent);background:var(--accent)}
.step.run .pip{border-color:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.step.err .pip{border-color:var(--crit);background:var(--crit)}
.step b{font-weight:700;display:block}
.step span{color:var(--ink-3);font-size:11.5px}
.checklist{display:flex;flex-direction:column;gap:1px}
.checkitem{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;align-items:start}
.checkitem:last-child{border-bottom:0}
.checkitem i{font-style:normal;font-weight:700;line-height:1.4}
.evalstrip{display:flex;flex-wrap:wrap;gap:4px}
.evalcell{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid transparent}
.evalcell.p{background:var(--pass-soft);color:var(--pass)}
.evalcell.f{background:var(--crit-soft);color:var(--crit)}
.evalcell.i{background:var(--sunk);color:var(--ink-3)}

/* dashboard -------------------------------------------------------------- */
.qtable{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
.qtable th{text-align:left;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;padding:0 10px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.qtable td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.qtable tbody tr:hover{background:var(--surface-2)}
.qtable tr.out td{opacity:.55}
.qtable .price{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.supcell b{display:block;font-weight:700}
.supcell span{font-size:11.5px;color:var(--ink-3)}
.meter{height:4px;background:var(--sunk);border-radius:3px;overflow:hidden;width:58px;margin-top:3px}
.meter i{display:block;height:100%;background:var(--accent)}

/* compare ---------------------------------------------------------------- */
.matrix{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.matrix th{text-align:left;padding:7px 10px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);border-bottom:1px solid var(--line)}
.matrix td{padding:7px 10px;border-bottom:1px solid var(--line-2)}
.matrix td.v{font-weight:600}
.lenses{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:14px}
.lens{border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px 17px;background:var(--surface);display:flex;flex-direction:column;gap:7px}
.lens.win{border-color:var(--accent);border-width:2px;box-shadow:var(--shadow)}
.lens h3{font-size:15px}
.lens .who{font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.1}
.lens .amt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-2)}
.lens ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.lens li{margin-bottom:3px}
details.more{border-top:1px solid var(--line-2);padding-top:9px;margin-top:2px}
details.more summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--accent)}

/* reviews ---------------------------------------------------------------- */
.review{border:1px solid var(--line);border-left:3px solid var(--human);border-radius:var(--radius);background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.review.crit{border-left-color:var(--crit)}
.review.done{border-left-color:var(--pass);opacity:.72}
.review .q{font-weight:700;font-size:13.5px}
.evbox{font-family:var(--mono);font-size:11.5px;background:var(--sunk);border-left:2px solid var(--mark-line);padding:5px 9px;border-radius:0 3px 3px 0;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:5px 9px;width:100%}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink-2)}

/* logs ------------------------------------------------------------------- */
.logtable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;min-width:700px}
.logtable td{padding:3px 9px;border-bottom:1px solid var(--line-2);vertical-align:top}
.logtable td:nth-child(4){color:var(--ink-3);font-family:var(--sans);font-size:12px}

/* guardrails ------------------------------------------------------------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}
.gcard{border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;background:var(--surface)}
.gcard h4{font-family:var(--disp);font-size:15px;font-weight:600;margin-bottom:2px}
.gcard dl{margin:7px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:12.5px}
.gcard dt{color:var(--ink-3);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.gcard dd{margin:0}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 17px;border-radius:22px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:50;max-width:88vw}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:var(--radius);padding:9px 13px;font-size:12.5px;font-weight:600;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.banner.ok{border-color:var(--pass);background:var(--pass-soft);color:var(--pass)}

/* nav sections ----------------------------------------------------------- */
.nav-sec{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:700;padding:14px 9px 3px}
.nav a.small{font-size:12.5px;padding:4px 9px;color:var(--ink-3)}

/* inbox sync --------------------------------------------------------------- */
.syncbar{display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);font-size:12.5px;font-weight:600;color:var(--accent);margin-bottom:14px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .9s linear infinite;flex:none;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.syncbar .bar{flex:1;height:4px;background:var(--surface);border-radius:3px;overflow:hidden}
.syncbar .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.arrive{animation:arrive .5s ease-out both}
@keyframes arrive{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.banner .spin{color:var(--warn)}

/* new inquiry wizard ------------------------------------------------------- */
.wizard{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.steps{display:flex;gap:6px;margin-bottom:16px;font-size:12px}
.steps span{padding:4px 11px;border-radius:20px;background:var(--sunk);color:var(--ink-3);font-weight:600}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.steps span.done{background:var(--pass-soft);color:var(--pass)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .wide{grid-column:1/-1}
label.f.miss{color:var(--warn)}
label.f.miss input[type=text],label.f.miss input[type=number],label.f.miss textarea,label.f.miss .chips{background:var(--mark);border-color:var(--mark-line)}
label.f.miss .row input{background:var(--mark);border-color:var(--mark-line)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:5px;border:1px solid transparent;border-radius:var(--radius)}
.chips button{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.qlist{display:flex;flex-direction:column;gap:4px}
.qlist div{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:400;color:var(--ink);padding:4px 8px;background:var(--surface-2);border-radius:var(--radius)}
.ready-item{display:grid;grid-template-columns:16px 1fr;gap:9px;padding:8px 8px;border-bottom:1px solid var(--line-2);font-size:12.5px;margin:0 -8px}
.ready-item.must{background:var(--mark)}
.ready-item i{font-style:normal}
.score{font-family:var(--disp);font-size:36px;font-weight:700;line-height:1}

.lens .amt{font-size:12px}
